name: Send Daily NSE Bulk Deals Text Report

on:
  schedule:
    # Runs Monday to Friday at 8:00 PM IST (14:30 UTC)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install pyTelegramBotAPI pandas curl_cffi

      - name: Execute Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bulkdeals.py
